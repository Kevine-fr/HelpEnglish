name: helpenglish
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^1.1.6
  cached_network_image: ^3.0.0
  fl_chart: ^0.69.2
  vibration: ^3.1.4

  # State management
  provider: ^6.1.1

  # HTTP / utils
  http: ^1.2.0
  intl: ^0.20.2
  intl_phone_number_input: ^0.7.0+2
  shared_preferences: ^2.3.2

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5

  # Device & permissions
  geolocator: ^9.0.2
  geocoding: ^2.2.2
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  device_info_plus: ^10.1.2

  # Time utils
  time_passed: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - images/
